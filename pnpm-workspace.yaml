packages:
  - apps/*
  - packages/*
  - e2e
  - tools/*
  - tests/*

# pnpm 10 memblokir skrip install; supabase perlu postinstall untuk mengunduh binary CLI.
onlyBuiltDependencies:
  - supabase

# Versi bersama untuk semua paket; pakai `"nama": "catalog:"` di package.json.
catalog:
  '@biomejs/biome': 2.6.8
  # Versi terbaru yang mendukung runner CI Ubuntu 26.04 LTS; CI mengunduh browser sesuai versi ini.
  '@playwright/test': 1.65.1
  # Tur panduan (T-599): MIT; intro.js ditolak karena AGPL-3.0. Dimuat lazy saat tur dimulai.
  driver.js: 1.14.0
  # Objek 3D (T-571): MIT, disetujui pemilik 2026-10-06; hanya dimuat lazy saat mode 3D dibuka.
  three: 0.187.0
  '@types/three': 0.187.0
  # Audit aksesibilitas T-412 (MPL-2.0; hanya alat test, keputusan pemilik 2026-10-05).
  '@axe-core/playwright': 4.14.0
  '@supabase/supabase-js': ^2.119.2
  '@tailwindcss/vite': ^4.3.5
  '@tanstack/react-query': ^5.108.3
  '@types/geojson': ^7946.0.16
  '@types/node': ^22.20.4
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.7
  '@vitejs/plugin-react': ^6.3.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  i18next: ^27.2.4
  lucide-react: ^1.77.0
  maplibre-gl: ^6.19.0
  pdfjs-dist: ^6.5.438
  radix-ui: ^1.8.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-i18next: ^18.0.3
  react-router: ^8.5.2
  sonner: ^2.0.8
  supabase: ^2.118.0
  tailwind-merge: ^3.7.1
  tailwindcss: ^4.3.5
  terra-draw: ^1.40.0
  terra-draw-maplibre-gl-adapter: ^1.5.0
  turbo: 2.11.13
