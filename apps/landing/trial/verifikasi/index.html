<!doctype html>
<html lang="id" data-surface="visitor" data-site="landing" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Tema dipasang sebelum halaman digambar agar tidak berkedip; aturan sama dengan src/theme.tsx.
      (() => {
        let theme = "light";
        try {
          const saved = localStorage.getItem("panduarah-landing.theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch {
          // Penyimpanan diblokir: mode terang.
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tujuan tautan sekali pakai di email verifikasi trial (T-616): tidak diindeks, dan alamat
         ber-token tidak dikirim ke situs lain sebagai Referer. -->
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Peta interaktif 2D/3D dan petunjuk arah langkah demi langkah untuk gedung Anda."
    />
    <meta name="theme-color" content="#111418" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Verifikasi trial — PanduArah</title>
  </head>
  <body data-page="trial-verify">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
