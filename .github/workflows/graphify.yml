name: Graf graphify

# Menjaga graphify-out/ di main tetap mutakhir agar Claude cukup memakai graf ter-commit.
# Commit memakai GITHUB_TOKEN sehingga tidak memicu workflow lain (tidak berulang).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'graphify-out/**'
      - 'docs/**'
      - '**/*.md'
      - 'e2e/evidence/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graphify-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install 'graphifyy[sql]==0.9.104'
      # Bangun dari nol: build inkremental di atas graph.json ter-commit tidak deterministik
      # (komunitas dan sebagian edge berubah walau kode sama), sehingga selalu memicu commit.
      - run: rm -rf graphify-out
      - run: graphify extract . --code-only && graphify cluster-only . --no-label --no-viz
      - name: Commit bila isi graf berubah
        run: |
          if python3 scripts/graphify-unchanged.py; then
            echo "Isi graf tidak berubah."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graphify-out/graph.json graphify-out/GRAPH_REPORT.md
          git commit -m 'chore: perbarui graf graphify'
          git push
