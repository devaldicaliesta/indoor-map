name: Hosting keepalive

# Supabase Free menjeda project setelah 7 hari tanpa aktivitas. Satu query ringan sehari menjaga
# project trial ter-hosting (F2-K, deploy/hosting/README.md) tetap aktif. Tanpa rahasia
# HOSTING_SUPABASE_URL dan HOSTING_SUPABASE_ANON_KEY langkahnya dilewati, jadi aman sebelum
# project dibuat.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query ringan ke database ter-hosting
        env:
          URL: ${{ secrets.HOSTING_SUPABASE_URL }}
          KEY: ${{ secrets.HOSTING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Rahasia hosting belum diisi; dilewati."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/license_status" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "Project ter-hosting aktif."
