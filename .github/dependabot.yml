# Versi action GitHub (mis. peringatan runtime Node yang usang). Dependency npm tidak di sini:
# kerentanannya sudah ditahan `pnpm audit` di workflow Security, dan setiap dependency baru
# perlu alasan di PR (CLAUDE.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'CI'
